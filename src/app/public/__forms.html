<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Netlify Forms</title></head>
  <body>
    <!--
      Bu gizli dosya yalnızca Netlify'ın form alanlarını derleme sırasında
      algılaması içindir. Ziyaretçiler bunu görmez. Gerçek form
      src/components/contact/ContactForm.tsx içindedir.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
